name: YT-DLP Studio desktop (Windows)

on:
  push:
    branches: [claude/desktop-app]
    paths: ['yt-dlp-gui/**', '.github/workflows/yt-dlp-studio-desktop.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: yt-dlp-gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: yt-dlp-gui/desktop/requirements-desktop.txt

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -U pip
          python -m pip install --disable-pip-version-check -r desktop/requirements-desktop.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Download ffmpeg and deno
        run: ./desktop/fetch-tools.ps1

      - name: Build with PyInstaller
        run: python -m PyInstaller desktop/yt-dlp-studio.spec --noconfirm --clean --distpath dist --workpath build

      - name: Self-test the built app
        run: |
          $report = Join-Path $PWD 'dist\self-test.json'
          $p = Start-Process -FilePath 'dist\YT-DLP Studio\YT-DLP Studio.exe' -ArgumentList '--self-test', "`"$report`"" -Wait -PassThru
          if (Test-Path $report) { Get-Content $report } else { Write-Host 'no report written' }
          if ($p.ExitCode -ne 0) {
            Get-Content "$env:APPDATA\yt-dlp-gui\logs\app.log" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Launch the app window (end-to-end)
        run: |
          $inst = "$env:APPDATA\yt-dlp-gui\instance.json"
          Remove-Item $inst -ErrorAction SilentlyContinue
          $app = Start-Process -FilePath 'dist\YT-DLP Studio\YT-DLP Studio.exe' -PassThru
          for ($i = 0; $i -lt 60 -and -not (Test-Path $inst); $i++) { Start-Sleep 1 }
          if (-not (Test-Path $inst)) { Get-Content "$env:APPDATA\yt-dlp-gui\logs\app.log"; throw 'the app did not start' }
          $info = Get-Content $inst | ConvertFrom-Json
          # the interface is loaded and its script is running once WebView2 holds a connection to the app
          $connected = $false
          for ($i = 0; $i -lt 90 -and -not $connected; $i++) {
            Start-Sleep 1
            $connected = [bool](Get-NetTCPConnection -RemotePort $info.port -State Established -ErrorAction SilentlyContinue |
              Where-Object { (Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).ProcessName -like 'msedgewebview2*' })
          }
          Write-Host "WebView2 connected: $connected"
          Start-Sleep 3
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bitmap.Save("$PWD\dist\screenshot.png")
          } catch { Write-Host "screenshot failed: $_" }
          Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:$($info.port)/api/desktop/quit" `
            -Headers @{ 'X-Token' = $info.token } -ContentType 'application/json' -Body '{}' | Out-Null
          $exited = $app.WaitForExit(30000)
          Write-Host "Exited after quit: $exited"
          Get-Content "$env:APPDATA\yt-dlp-gui\logs\app.log" | Select-Object -Last 15
          if (-not $connected) { throw 'the window did not load the interface' }
          if (-not $exited) { throw 'the app did not exit' }

      - name: Build the installer
        run: |
          $version = python -c "from backend.version import APP_VERSION; print(APP_VERSION)"
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$version" desktop\installer.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Portable archive
        run: Compress-Archive -Path 'dist\YT-DLP Studio' -DestinationPath "dist\YT-DLP-Studio-$env:APP_VERSION-portable.zip"

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: YT-DLP-Studio-${{ env.APP_VERSION }}-Setup
          path: yt-dlp-gui/dist/YT-DLP-Studio-Setup-*.exe
          if-no-files-found: error
          compression-level: 0        # already compressed by Inno Setup
          retention-days: 90

      - name: Upload the portable version
        uses: actions/upload-artifact@v4
        with:
          name: YT-DLP-Studio-${{ env.APP_VERSION }}-portable
          path: yt-dlp-gui/dist/YT-DLP-Studio-*-portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload the screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: yt-dlp-gui/dist/screenshot.png
          if-no-files-found: ignore
          retention-days: 14
